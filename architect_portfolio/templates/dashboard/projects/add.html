<!-- templates/dashboard/projects/add.html -->
{% extends "dashboard/base.html" %}
{% load static %}
{% block title %}{{ page_title }} - Dashboard{% endblock %}
{% block styles %}
<link rel="stylesheet" href="{% static 'css/dashboard/add_projects.css' %}">
{% endblock %}
{% block content %}
<h2>{{ page_title }}</h2>

<form method="post" enctype="multipart/form-data">
    {% csrf_token %}
    
    <label>Title:</label>
    <input type="text" name="title" required><br>

    <label>Slug (URL-friendly name):</label>
    <input type="text" name="slug" required><br>

    <label>Description:</label><br>
    <textarea name="description" rows="5" required></textarea><br>

    <label>Category:</label>
    <input type="text" name="category" required><br>

    <label>Location:</label>
    <input type="text" name="location" required><br>

    <label>Year:</label>
    <input type="number" name="year" required><br>

    <label>Featured Image:</label>
    <input type="file" name="featured_image" accept="image/*" required><br>

    <label>Additional Images:</label>
    <input type="file" name="images" accept="image/*" multiple><br>

    <label>Tags (comma-separated):</label>
    <input type="text" name="tags"><br>

    <button type="submit">Save Project</button>
</form>
{% endblock %}
